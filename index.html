<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<title>Character Home</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div id="game">


<!-- ホーム -->

<div id="home">


<div id="date"></div>


<img id="character"
src="images/character001.png">


<div id="message">
こんにちは。
</div>


<!-- タッチ範囲 -->

<div id="head"></div>

<div id="body"></div>



<button id="characterBtn">
キャラ一覧
</button>


<button id="backgroundBtn">
背景変更
</button>



</div>



<!-- キャラ選択 -->

<div id="characterMenu">

<div id="iconGrid"></div>

</div>



<!-- 背景選択 -->

<div id="backgroundMenu">

<div class="bgChoice"
onclick="changeBackground('images/bg1.jpg')">
背景1
</div>


<div class="bgChoice"
onclick="changeBackground('images/bg2.jpg')">
背景2
</div>


<div class="bgChoice"
onclick="changeBackground('images/bg3.jpg')">
背景3
</div>


<button id="closeBG">
戻る
</button>


</div>


</div>


<script src="script.js"></script>

</body>

</html>
