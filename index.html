<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<title>Character Game</title>

<style>

body{
    margin:0;
    background:white;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:sans-serif;
}


/* ゲーム画面 */

#game{

    width:900px;
    height:506px;

    border:2px solid #ddd;

    position:relative;
    overflow:hidden;

    background:white;

}



/* キャラ画像 */

#character{

    position:absolute;

    user-select:none;

}



/* 台詞 */

#message{

    position:absolute;

    display:none;

    background:white;

    padding:15px 25px;

    border-radius:30px;

    box-shadow:0 5px 20px #0002;

    font-size:20px;

    animation:pop .25s;

}



@keyframes pop{

from{

opacity:0;

transform:translateY(20px);

}

to{

opacity:1;

transform:none;

}

}


</style>

</head>


<body>


<div id="game">

<img id="character">

<div id="message"></div>

</div>



<script>


let data;


let count={};


let lastClick=0;



const game =
document.getElementById("game");


const character =
document.getElementById("character");


const message =
document.getElementById("message");





/*
キャラ読み込み
*/

fetch("characters/143.json")

.then(res=>res.json())

.then(json=>{


data=json;


loadCharacter();


showGreeting();


});






function loadCharacter(){


let p=data.position;


character.src=
"images/"+data.image;



character.style.left=
p.x+"px";


character.style.top=
p.y+"px";


character.style.width=
p.scale+"px";


}






function showGreeting(){


if(
data.talk.greeting &&
data.talk.greeting.length
){

showTalk(
data.talk.greeting[0].text,
450,
100
);

}


}







function showTalk(text,x,y){


message.innerText=text;


message.style.left=x+"px";


message.style.top=y+"px";


message.style.display="block";



setTimeout(()=>{

message.style.display="none";

},2500);


}






function inside(x,y,area){


return (

x >= area.x &&
x <= area.x + area.width &&

y >= area.y &&
y <= area.y + area.height

);


}







function getArea(x,y){


for(
let area of data.areas
){


if(
inside(x,y,area)
){

return area;

}

}


return null;


}







game.onclick=function(e){


let rect=
game.getBoundingClientRect();


let x=
e.clientX-rect.left;


let y=
e.clientY-rect.top;



let now=Date.now();


let rapid=
(now-lastClick<400);


lastClick=now;




let talkList;




/*
連打
*/

if(

rapid &&

data.talk.rapid &&

data.talk.rapid.length

){

talkList=data.talk.rapid;

}


/*
エリア
*/

else{


let area=
getArea(x,y);



if(area){

talkList=area.talk;

}

else{

talkList=data.talk.normal;

}


}




/*
回数管理

台詞数はキャラデータ依存

*/


let key=talkList;


if(!count[key]){

count[key]=0;

}


let index=count[key];



if(index >= talkList.length){

index=talkList.length-1;

}

else{

count[key]++;

}



showTalk(

talkList[index].text,

x,

y

);



};



</script>


</body>

</html>
