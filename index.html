<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<title>Character Home</title>


<style>

body{

margin:0;

background:white;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

font-family:sans-serif;

}



/* ゲーム画面 */

#game{

width:900px;

height:506px;

border:2px solid #ddd;

position:relative;

overflow:hidden;

background:white;

}



/* キャラ */

#character{

position:absolute;

bottom:0;

left:350px;

width:250px;

}



/* 台詞 */

#message{

position:absolute;

background:rgba(255,255,255,.9);

padding:15px 25px;

border-radius:30px;

box-shadow:0 5px 20px #0002;

font-size:20px;

animation:pop .3s;

}



@keyframes pop{

from{

transform:translateY(20px);

opacity:0;

}

to{

transform:none;

opacity:1;

}

}



/* 判定 */

.area{

position:absolute;

}



#head{

left:420px;

top:100px;

width:100px;

height:100px;

}



#body{

left:380px;

top:250px;

width:200px;

height:150px;

}



</style>

</head>


<body>


<div id="game">


<img id="character" src="images/143.png">


<div id="head" class="area"></div>

<div id="body" class="area"></div>


<div id="message"></div>


</div>



<script>


const talks={


greeting:[

"来たか。"

],


normal:[

"どうした？",

"何か用か？",

"暇なのか？"

],


head:[

"そこを触るのか",

"まだ触るのか？",

"……しつこいな。"

],


body:[

"近いな",

"何をしている？",

"そろそろ離れろ。"

],


fast:[

"連打するな。",

"落ち着け。"

]


};



let count={

normal:0,

head:0,

body:0

};



let lastClick=0;



const message=
document.getElementById("message");



function speak(text,x,y){


message.innerText=text;


message.style.left=x+"px";

message.style.top=y+"px";


}



function selectTalk(type,x,y){


count[type]++;


let arr=talks[type];


let index=
Math.min(
count[type]-1,
arr.length-1
);


speak(
arr[index],
x,
y
);


}




/* 起動挨拶 */

setTimeout(()=>{

speak(
talks.greeting[0],
450,
120
);

},500);





game.onclick=function(e){


const now=Date.now();


let type="normal";



/* 連打 */

if(now-lastClick<400){

type="fast";

}

lastClick=now;




let rect=
game.getBoundingClientRect();


let x=e.clientX-rect.left;

let y=e.clientY-rect.top;



if(
x>420 &&
x<520 &&
y>100 &&
y<200
){

type="head";

}


else if(
x>380 &&
x<580 &&
y>250 &&
y<400
){

type="body";

}



if(type==="fast"){

speak(
talks.fast[
Math.floor(
Math.random()*talks.fast.length
)
],
x,
y
);

}

else{

selectTalk(
type,
x,
y
);

}


};


</script>


</body>

</html>
