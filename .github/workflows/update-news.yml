name: Update Notion News Ticker

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
      timezone: 'Asia/Tokyo'
  push:
    paths:
      - 'scripts/update-news.mjs'
      - '.github/workflows/update-news.yml'

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch Notion data
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/update-news.mjs

      - name: Commit news-feed.json when changed
        shell: bash
        run: |
          if git diff --quiet -- news-feed.json; then
            echo "news-feed.json has no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news-feed.json
          git commit -m "Update Notion news ticker"
          git push
